services:
    postgres:
        image: pgvector/pgvector:pg17
        container_name: prod-db
        environment:
            - POSTGRES_USER=${PROD_DB_USER}
            - POSTGRES_PASSWORD=${PROD_DB_PASSWORD}
            - POSTGRES_DB=${PROD_DB_POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: always
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5

    ollama:
        image: ollama/ollama:0.32.5
        container_name: prod-ollama-embed
        volumes:
            - ollama_data:/root/.ollama
        restart: always
        entrypoint: [ "/bin/sh", "-c" ]
        command: >
            "ollama serve &
            sleep 5;
            ollama pull nomic-embed-text:v1.5;
            wait"
        healthcheck:
            test: [ "CMD-SHELL", "ollama list | grep -q 'nomic-embed-text:v1.5' || exit 1" ]
            interval: 300s
            timeout: 5s
            retries: 3
            start_period: 15s

    backend:
        build:
            context: ./backend
        container_name: prod-backend
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - PROD_DB_URL=jdbc:postgresql://postgres:5432/${PROD_DB_POSTGRES_DB}
            - PROD_DB_USER=${PROD_DB_USER}
            - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
            - PROD_DB_POSTGRES_DB=${PROD_DB_POSTGRES_DB}
            - PROD_OLLAMA_URL=${PROD_OLLAMA_URL}
            - TMDB_API_KEY=${TMDB_API_KEY}
            - JWT_SECRET_KEY=${JWT_SECRET_KEY}
            - OAUTH2_GOOGLE_CLIENT_ID=${OAUTH2_GOOGLE_CLIENT_ID}
            - OAUTH2_GOOGLE_SECRET_ID=${OAUTH2_GOOGLE_SECRET_ID}
        depends_on:
            postgres:
                condition: service_healthy
            ollama:
                condition: service_healthy
        deploy:
            restart_policy:
                condition: on-failure
                delay: 5s
                max_attempts: 5
                window: 120s
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/actuator/health || exit 1" ]
            interval: 20s
            timeout: 5s
            retries: 3
            start_period: 45s

    frontend:
        build:
            context: ./frontend
            args:
                - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL}
        container_name: prod-frontend
        environment:
            - BACKEND_URL=${BACKEND_URL}
        ports:
            - "3000:3000"
        depends_on:
            backend:
                condition: service_healthy
        deploy:
            restart_policy:
                condition: on-failure
                delay: 3s
                max_attempts: 5
                window: 60s
        volumes:
            - /var/www/static-legal-files/impressum-content.html:/app/public/impressum-content.html
            - /var/www/static-legal-files/privacy-content.html:/app/public/privacy-content.html
            - /var/www/static-legal-files/terms-of-service-content.html:/app/public/terms-of-service-content.html
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 60s

volumes:
    postgres_data:
    ollama_data:
